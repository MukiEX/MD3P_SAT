<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="470" fill="#f7f6fb"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#221d33">Rotary encoder in place of the d-pad (real Saturn control pad)</text>
  <text x="24" y="56" font-size="13" fill="#6a6380">Spinner across the d-pad pairs: phase A on LEFT (or RIGHT), phase B on UP (or DOWN). A quick spin latches it.</text>

  <!-- pad PCB -->
  <rect x="24" y="78" width="420" height="290" rx="18" fill="#2f7d4f" stroke="#1d5235" stroke-width="2"/>
  <text x="40" y="100" font-size="12" fill="#d7f0df" font-weight="700">PAD PCB (d-pad rubber removed)</text>

  <!-- comb contact helper: ground half grey, signal half gold -->
  <defs>
    <g id="comb">
      <rect x="-22" y="-16" width="44" height="32" rx="5" fill="#1d5235"/>
      <path d="M-18 -12 H18 M-18 -12 V12 M-18 0 H10 M-18 12 H10" stroke="#b9c2bd" stroke-width="3" fill="none"/>
      <path d="M18 -12 V12 M18 -6 H-10 M18 6 H-10" stroke="#e8b33a" stroke-width="3" fill="none"/>
    </g>
  </defs>
  <!-- d-pad combs -->
  <use href="#comb" x="150" y="150"/><text x="150" y="128" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">UP</text>
  <use href="#comb" x="150" y="290"/><text x="150" y="324" font-size="12" fill="#d7f0df" text-anchor="middle">DOWN</text>
  <use href="#comb" x="80" y="220"/><text x="80" y="254" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">LEFT</text>
  <use href="#comb" x="220" y="220"/><text x="220" y="254" font-size="12" fill="#d7f0df" text-anchor="middle">RIGHT</text>
  <circle cx="150" cy="220" r="10" fill="#1d5235" stroke="#14402a"/>
  <!-- START comb -->
  <use href="#comb" x="330" y="150"/><text x="330" y="128" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">START</text>
  <!-- GND pad -->
  <circle cx="330" cy="300" r="12" fill="#b9c2bd" stroke="#7d8781" stroke-width="2"/>
  <text x="310" y="296" font-size="12" fill="#ffffff" text-anchor="end" font-weight="700">GND</text>
  <text x="310" y="311" font-size="10.5" fill="#d7f0df" text-anchor="end">any ground point / plug pin 9</text>

  <!-- legend for combs -->
  <rect x="40" y="338" width="12" height="4" fill="#b9c2bd"/><text x="58" y="343" font-size="11" fill="#d7f0df">ground half</text>
  <rect x="134" y="338" width="12" height="4" fill="#e8b33a"/><text x="152" y="343" font-size="11" fill="#d7f0df">signal half (solder here)</text>

  <!-- encoder, bottom view -->
  <rect x="560" y="150" width="120" height="120" rx="10" fill="#c9c6d3" stroke="#6a6380" stroke-width="2"/>
  <circle cx="620" cy="210" r="30" fill="#e8e6ee" stroke="#6a6380" stroke-width="2"/>
  <text x="620" y="214" font-size="11" fill="#6a6380" text-anchor="middle">shaft</text>
  <text x="620" y="140" font-size="13" fill="#221d33" text-anchor="middle" font-weight="700">Encoder (bottom view)</text>
  <!-- pins: A C B on the left edge, switch pins on the right edge -->
  <g fill="#8a8796">
    <rect x="542" y="174" width="18" height="8" rx="2"/><rect x="542" y="206" width="18" height="8" rx="2"/><rect x="542" y="238" width="18" height="8" rx="2"/>
    <rect x="680" y="186" width="18" height="8" rx="2"/><rect x="680" y="226" width="18" height="8" rx="2"/>
  </g>
  <text x="570" y="182" font-size="12" fill="#221d33" font-weight="700">A</text>
  <text x="570" y="214" font-size="12" fill="#221d33" font-weight="700">C</text>
  <text x="570" y="246" font-size="12" fill="#221d33" font-weight="700">B</text>
  <text x="652" y="194" font-size="11" fill="#221d33" font-weight="700">SW</text>
  <text x="652" y="234" font-size="11" fill="#221d33" font-weight="700">SW</text>

  <!-- wires -->
  <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M542 178 H480 V196 H100 V206" stroke="#2f7fe0"/>
    <path d="M542 242 H500 V112 H162 V138" stroke="#e8792f"/>
    <path d="M542 210 H460 V300 H342" stroke="#221d33"/>
    <path d="M698 190 H722 V96 H342 V138" stroke="#2fa86a"/>
    <path d="M698 230 H736 V392 H330 V312" stroke="#221d33"/>
  </g>
  <circle cx="100" cy="206" r="4" fill="#2f7fe0"/><circle cx="162" cy="138" r="4" fill="#e8792f"/>
  <circle cx="342" cy="300" r="4" fill="#221d33"/><circle cx="342" cy="138" r="4" fill="#2fa86a"/><circle cx="330" cy="312" r="4" fill="#221d33"/>
  <text x="560" y="90" font-size="11" fill="#2fa86a" font-weight="700">push switch → START (or A / C)</text>
  <g font-size="12" font-weight="700">
    <text x="560" y="300" fill="#2f7fe0">A → LEFT signal half</text>
    <text x="560" y="318" fill="#e8792f">B → UP signal half</text>
    <text x="560" y="336" fill="#221d33">C (common) → GND</text>
    <text x="560" y="354" fill="#2fa86a">SW → START, SW → GND</text>
  </g>

  <!-- notes -->
  <g font-size="12.5" fill="#221d33">
    <text x="24" y="410" font-weight="700" fill="#c53048">Never LEFT+RIGHT or UP+DOWN: a real pad drops off the bus while both of a pair are held.</text>
    <text x="24" y="430">Any corner works: (LEFT or RIGHT) + (UP or DOWN). No resistors, + left unconnected; the pad's own pull-ups do it.</text>
    <text x="24" y="450">Use a detentless encoder (or remove the detent spring): a detented one snaps through most of each click between two reads.</text>
  </g>
</svg>
